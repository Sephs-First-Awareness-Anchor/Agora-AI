name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Buildozer
    # NOTE: ubuntu-latest is currently Ubuntu 24.04 on GitHub-hosted runners.
    # python-for-android's libffi recipe can fail there during autoreconf
    # (e.g., 'possibly undefined macro: LT_SYS_SYMBOL_USCORE'). Pinning to 22.04
    # + installing the full autotools stack stabilizes the build.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          # Separate cache namespace for the pinned runner image.
          key: buildozer-global-u22-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-u22-${{ runner.os }}-

      - name: Cache project build directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-local-u22-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            buildozer-local-u22-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-pip \
            ffmpeg \
            libffi-dev \
            libssl-dev \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libtool-bin \
            m4 \
            gettext \
            pkg-config \
            cmake \
            zlib1g-dev \
            libsqlite3-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            zip \
            unzip \
            openjdk-17-jdk \
            libncurses5 \
            libncurses5-dev \
            libtinfo5 \
            libffi8

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agoraai-debug-apk
          path: bin/*.apk

  build-release:
    name: Build Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-global-release-u22-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-release-u22-${{ runner.os }}-

      - name: Cache project build directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-local-release-u22-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            buildozer-local-release-u22-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-pip \
            ffmpeg \
            libffi-dev \
            libssl-dev \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libtool-bin \
            m4 \
            gettext \
            pkg-config \
            cmake \
            zlib1g-dev \
            libsqlite3-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            zip \
            unzip \
            openjdk-17-jdk \
            libncurses5 \
            libncurses5-dev \
            libtinfo5 \
            libffi8

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Build Release APK
        run: |
          buildozer -v android release

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agoraai-release-apk
          path: bin/*.apk
