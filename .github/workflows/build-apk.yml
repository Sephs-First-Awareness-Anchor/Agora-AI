name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system deps (autotools/libffi/gstreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip rsync \
            build-essential ccache \
            openjdk-17-jdk \
            pkg-config \
            autoconf automake libtool libtool-bin autoconf-archive \
            cmake \
            libffi-dev libssl-dev \
            libunwind-dev \
            libz-dev zlib1g-dev \
            libjpeg-dev libpng-dev \
            libsdl2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            python3-venv

      - name: Install Buildozer + python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Buildozer + p4a are sensitive to runner/toolchain drift; use freshest p4a
          python -m pip install --upgrade \
            cython==0.29.36 \
            buildozer \
            "python-for-android @ https://github.com/kivy/python-for-android/archive/refs/heads/master.zip"

      - name: Build APK (debug)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agoraai-apk
          path: |
            bin/*.apk
            **/bin/*.apk
          if-no-files-found: error
