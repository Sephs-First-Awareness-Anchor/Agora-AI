name: Build Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  ANDROID_API: "33"
  ANDROID_MINAPI: "21"
  ANDROID_NDK: "25b"
  ANDROID_SDK: "33"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ env.ANDROID_NDK }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Buildozer local build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            buildozer-local-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-
            buildozer-local-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            python3-pip \
            python3-venv \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            cmake \
            libtool \
            pkg-config \
            zip \
            unzip \
            openjdk-17-jdk \
            autogen \
            gettext \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5

      - name: Install Buildozer and dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify buildozer.spec exists
        run: |
          set -euxo pipefail
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi
          buildozer --version

      - name: Build Debug APK (always logs)
        run: |
          set -euxo pipefail
          echo "Starting debug build..." | tee build.log
          # Let Buildozer manage SDK/NDK paths; hardcoding is fragile on CI
          buildozer android debug 2>&1 | tee -a build.log
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        timeout-minutes: 150

      - name: Verify APK output
        if: always()
        run: |
          set -euxo pipefail
          echo "Checking for APK files..." | tee -a build.log
          ls -la bin/ 2>/dev/null | tee -a build.log || echo "No bin directory found" | tee -a build.log
          find . -name "*.apk" -type f 2>/dev/null | head -10 | tee -a build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agora-ai-debug-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-debug
          path: build.log
          retention-days: 7
          if-no-files-found: warn
