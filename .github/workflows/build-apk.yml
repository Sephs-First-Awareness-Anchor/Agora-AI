name: Build Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  ANDROID_API: '33'
  ANDROID_MINAPI: '21'
  ANDROID_NDK: '25b'
  ANDROID_SDK: '33'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ env.ANDROID_NDK }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Buildozer local build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            buildozer-local-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-
            buildozer-local-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            python3-pip \
            python3-venv \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            cmake \
            libtool \
            pkg-config \
            zip \
            unzip \
            openjdk-17-jdk \
            autogen \
            gettext \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5

     

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36
          pip install -r requirements.txt || echo "No requirements.txt found or install failed"

      - name: Initialize Buildozer (if needed)
        run: |
          # Ensure buildozer doesn't try to create a new spec
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi
          
          # Check buildozer version
          buildozer --version
          
          # Verify spec file
          buildozer spec >/dev/null || true

      - name: Build Debug APK
        run: |
          echo "Starting debug build..."
          export ANDROIDSDK="${HOME}/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="${HOME}/.buildozer/android/platform/android-ndk-r25b"
          export ANDROIDAPI="33"
          export ANDROIDMINAPI="21"
          
          # Run buildozer with verbose output
          buildozer android debug 2>&1 | tee build.log
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        timeout-minutes: 150

      - name: Verify APK output
        run: |
          echo "Checking for APK files..."
          ls -la bin/ 2>/dev/null || echo "No bin directory found"
          find . -name "*.apk" -type f 2>/dev/null | head -10

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agora-ai-debug-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-debug
          path: build.log
          retention-days: 7
        
