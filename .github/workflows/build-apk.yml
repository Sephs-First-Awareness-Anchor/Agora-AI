name: Build Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Buildozer/p4a is generally happier in CI on 3.10 than 3.11
  PYTHON_VERSION: "3.10"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Buildozer local build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            buildozer-local-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-
            buildozer-local-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            python3-pip \
            python3-venv \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            cmake \
            libtool \
            pkg-config \
            zip \
            unzip \
            autogen \
            gettext \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5

      - name: Preflight + create build log
        if: always()
        run: |
          set -euxo pipefail
          echo "=== Preflight ===" | tee build.log
          date | tee -a build.log
          uname -a | tee -a build.log
          python --version | tee -a build.log
          java -version 2>&1 | tee -a build.log
          echo "Repo root contents:" | tee -a build.log
          ls -la | tee -a build.log

      - name: Install Buildozer and Python deps
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "cython==0.29.36"
          # Install repo requirements if present (don’t hide failures)
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt present"
          fi

      - name: Verify buildozer.spec exists
        run: |
          set -euxo pipefail
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi
          buildozer --version

      - name: Build Debug APK (always logs)
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        timeout-minutes: 150
        run: |
          set -euxo pipefail
          echo "=== Starting buildozer android debug ===" | tee -a build.log
          # Important: do NOT hardcode ANDROIDSDK/ANDROIDNDK paths in CI.
          # Buildozer/p4a manages these under ~/.buildozer and .buildozer.
          buildozer -v android debug 2>&1 | tee -a build.log

      - name: Verify APK output
        if: always()
        run: |
          set -euxo pipefail
          echo "=== APK output check ===" | tee -a build.log
          echo "bin/ contents:" | tee -a build.log
          ls -la bin/ 2>/dev/null | tee -a build.log || echo "No bin directory found" | tee -a build.log
          echo "First 20 APKs found:" | tee -a build.log
          find . -name "*.apk" -type f 2>/dev/null | head -20 | tee -a build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agora-ai-debug-apk
          path: |
            bin/*.apk
            **/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-debug
          path: build.log
          retention-days: 7
          if-no-files-found: warn
